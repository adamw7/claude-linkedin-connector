name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Automerge dispatches it on main after a merge made with GITHUB_TOKEN, which starts no push run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # The oldest Node.js that engines allows, and the one the image and the other workflows run.
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
        timeout-minutes: 10
      - name: Summarize coverage
        run: |
          node --input-type=module >> "$GITHUB_STEP_SUMMARY" <<'JS'
          import { readFileSync } from 'node:fs';
          const { total } = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8'));
          console.log('## Coverage\n\n| Metric | % | Covered / total |\n| --- | ---: | ---: |');
          for (const metric of ['lines', 'statements', 'branches', 'functions']) {
            const { pct, covered, total: count } = total[metric];
            console.log(`| ${metric} | ${pct}% | ${covered} / ${count} |`);
          }
          JS
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report-node${{ matrix.node }}
          path: coverage/
      - run: npm run bench
        timeout-minutes: 10
      - run: npm run build
      - name: Smoke test the npm package
        run: node scripts/smoke-test-package.mjs
      - name: Bundle the Claude Desktop extension
        run: |
          npm run bundle
          node mcpb/server/index.cjs --version
          npx --no-install mcpb validate mcpb/manifest.json

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t claude-linkedin-connector:ci .
      - run: scripts/smoke-test-image.sh claude-linkedin-connector:ci
