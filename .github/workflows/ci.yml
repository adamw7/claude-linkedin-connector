name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Summarize coverage
        run: |
          node --input-type=module >> "$GITHUB_STEP_SUMMARY" <<'JS'
          import { readFileSync } from 'node:fs';
          const { total } = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8'));
          console.log('## Coverage\n\n| Metric | % | Covered / total |\n| --- | ---: | ---: |');
          for (const metric of ['lines', 'statements', 'branches', 'functions']) {
            const { pct, covered, total: count } = total[metric];
            console.log(`| ${metric} | ${pct}% | ${covered} / ${count} |`);
          }
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
      - run: npm run build
      - name: Bundle the Claude Desktop extension
        run: |
          npm run bundle
          node mcpb/server/index.cjs --version
          npx --no-install mcpb validate mcpb/manifest.json
