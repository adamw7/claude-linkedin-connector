name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the tag matches the version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm run check
        timeout-minutes: 10
      - name: Build the Claude Desktop extension
        run: |
          npm run pack:mcpb
          npx --no-install mcpb validate mcpb/manifest.json
          node mcpb/server/index.cjs --version
      - name: Extract release notes
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "::error::No CHANGELOG.md entry for $GITHUB_REF_NAME"; exit 1; }
          printf '\n### Docker image\n\nFor the remote server (amd64 and arm64):\n\n```sh\ndocker pull ghcr.io/%s:%s\n```\n' \
            "${GITHUB_REPOSITORY,,}" "${GITHUB_REF_NAME#v}" >> release-notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release drafted in the GitHub UI pushes the tag itself, so it already exists: fill it in instead.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" claude-linkedin-connector.mcpb --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" claude-linkedin-connector.mcpb \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
          fi

  # After the release job, so a package is only published for a version whose tests passed.
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance, and trusted publishing once it is configured on npmjs.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Pre-releases (1.2.0-rc.1) go to the next tag so `npm install` keeps getting the latest release.
          tag=latest
          [[ "$version" == *-* ]] && tag=next
          npm publish --provenance --access public --tag "$tag"
      - name: Smoke test the published package
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="$(mktemp -d)"
          # The registry can take a minute to serve a new version.
          for attempt in 1 2 3 4 5 6; do
            npm install --prefix "$dir" "claude-linkedin-connector@$version" && break
            [ "$attempt" = 6 ] && { echo "::error::claude-linkedin-connector@$version never became installable"; exit 1; }
            sleep 20
          done
          bin="$dir/node_modules/.bin/claude-linkedin-connector"
          [ "$("$bin" --version)" = "$version" ] || { echo "::error::the published package reports the wrong version"; exit 1; }
          "$bin" --help | grep -q '^Usage: claude-linkedin-connector' || { echo "::error::no help from the published package"; exit 1; }
          npm audit signatures --prefix "$dir"

  # After the release job, so an image is only published for a version whose tests passed.
  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Smoke test the image
        run: |
          docker build -t claude-linkedin-connector:release .
          scripts/smoke-test-image.sh claude-linkedin-connector:release
      - name: Push the image to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          tags=(--tag "$image:$version")
          # Pre-releases (1.2.0-rc.1) get only their own tag; releases also move 1.2 and latest.
          [[ "$version" == *-* ]] || tags+=(--tag "$image:${version%.*}" --tag "$image:latest")
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # The build stage runs on the runner's platform and the final stage has no RUN steps, so arm64 needs no emulation.
          docker buildx create --use --driver docker-container
          docker buildx build . --push --platform linux/amd64,linux/arm64 --provenance=mode=max --sbom=true \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.description=Remote MCP server (custom connector) that lets Claude use your LinkedIn account" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            "${tags[@]}"
