name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the tag matches the version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm run check
      - name: Build the Claude Desktop extension
        run: |
          npm run pack:mcpb
          npx -y @anthropic-ai/mcpb@2 validate mcpb/manifest.json
          node mcpb/server/index.cjs --version
      - name: Extract release notes
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "::error::No CHANGELOG.md entry for $GITHUB_REF_NAME"; exit 1; }
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" claude-linkedin-connector.mcpb \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
